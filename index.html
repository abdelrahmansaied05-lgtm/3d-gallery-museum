<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>معرض فني تفاعلي - Interactive Art Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: #000;
            touch-action: none;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 12px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.8);
            padding: 12px;
            border-radius: 8px;
            max-width: 280px;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 12px 20px;
            border-radius: 8px;
            color: #fff;
            text-align: center;
            z-index: 10;
            font-size: 11px;
            max-width: 90%;
        }

        /* Mobile Controls */
        #mobileControls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 20;
            display: none;
        }

        .joystick-container {
            width: 100px;
            height: 100px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #667eea;
            border-radius: 50%;
            position: relative;
            margin-bottom: 10px;
            touch-action: none;
        }

        .joystick-thumb {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            touch-action: none;
        }

        .mobile-button {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            margin: 5px;
            touch-action: none;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .mobile-button:active {
            transform: scale(0.95);
        }

        #passwordPrompt {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.98);
            padding: 30px 20px;
            border-radius: 15px;
            text-align: center;
            z-index: 100;
            display: none;
            backdrop-filter: blur(5px);
            max-width: 90%;
            width: 100%;
        }

        #passwordPrompt.show {
            display: block;
        }

        #passwordPrompt h2 {
            color: #fff;
            margin-bottom: 20px;
            font-size: 22px;
        }

        #passwordInput {
            padding: 12px;
            font-size: 18px;
            width: 100%;
            max-width: 280px;
            border: 2px solid #666;
            border-radius: 8px;
            background: #222;
            color: #fff;
            margin-bottom: 15px;
            text-align: center;
            letter-spacing: 2px;
        }

        #passwordInput:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .btn {
            padding: 12px 30px;
            font-size: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            max-width: 280px;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .success-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            z-index: 100;
            display: none;
            max-width: 90%;
        }

        .success-message.show {
            display: block;
            animation: celebrate 0.5s ease-in-out;
        }

        @keyframes celebrate {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.1); }
        }

        .success-message h1 {
            color: #ffd700;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #ffd700;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            #mobileControls {
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            #controls {
                display: none;
            }

            #ui {
                font-size: 11px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div id="ui">
        <div><strong>🎨 معرض فني</strong></div>
        <div style="margin-top: 8px; color: #aaa;">
            استخدم التحكم<br>
            للحركة والالتفات
        </div>
    </div>

    <div id="controls">
        ↑ W / ↓ S للأمام | ← A / → D لليمين | 🖱️ حرك الفأرة
    </div>

    <div id="mobileControls">
        <div class="joystick-container" id="joystickContainer">
            <div class="joystick-thumb" id="joystickThumb"></div>
        </div>
        <button class="mobile-button" id="jumpBtn">⬆️</button>
    </div>

    <div id="passwordPrompt">
        <h2>🔐 الباب مغلق</h2>
        <p style="color: #999; margin-bottom: 15px;">أدخل رمز الدخول</p>
        <input type="password" id="passwordInput" placeholder="الرمز" maxlength="8">
        <button class="btn" onclick="checkPassword()">فتح الباب</button>
    </div>

    <div class="success-message" id="successMessage">
        <h1>🎉 مرحباً ديانا!</h1>
        <p style="color: #fff; font-size: 16px;">تم فتح الباب بنجاح</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const canvas = document.getElementById('canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x1a1a1a);
        scene.background = new THREE.Color(0x1a1a1a);

        const CORRIDOR_LENGTH = 50;
        const CORRIDOR_WIDTH = 8;
        const WALL_HEIGHT = 4;

        // Player
        const player = {
            position: new THREE.Vector3(0, 1.6, -CORRIDOR_LENGTH / 2 + 5),
            velocity: new THREE.Vector3(0, 0, 0),
            speed: 0.15,
            isGrounded: false
        };

        camera.position.copy(player.position);

        // Floor
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(CORRIDOR_WIDTH, CORRIDOR_LENGTH),
            new THREE.MeshStandardMaterial({ color: 0xd4a574 })
        );
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Ceiling
        const ceiling = new THREE.Mesh(
            new THREE.PlaneGeometry(CORRIDOR_WIDTH, CORRIDOR_LENGTH),
            new THREE.MeshStandardMaterial({ color: 0x2a2a2a })
        );
        ceiling.rotation.x = Math.PI / 2;
        ceiling.position.y = WALL_HEIGHT;
        scene.add(ceiling);

        // Walls
        const leftWall = new THREE.Mesh(
            new THREE.PlaneGeometry(CORRIDOR_LENGTH, WALL_HEIGHT),
            new THREE.MeshStandardMaterial({ color: 0xf5f5f5 })
        );
        leftWall.rotation.y = Math.PI / 2;
        leftWall.position.set(-CORRIDOR_WIDTH / 2, WALL_HEIGHT / 2, 0);
        scene.add(leftWall);

        const rightWall = new THREE.Mesh(
            new THREE.PlaneGeometry(CORRIDOR_LENGTH, WALL_HEIGHT),
            new THREE.MeshStandardMaterial({ color: 0xf5f5f5 })
        );
        rightWall.rotation.y = Math.PI / 2;
        rightWall.position.set(CORRIDOR_WIDTH / 2, WALL_HEIGHT / 2, 0);
        scene.add(rightWall);

        // Paintings
        const colors = [0xff6b6b, 0x4ecdc4, 0xffe66d, 0xa8dadc, 0xf4a261, 0x2a9d8f];
        for (let i = 0; i < 10; i++) {
            const z = -CORRIDOR_LENGTH / 2 + i * 5;
            
            const paintL = new THREE.Mesh(
                new THREE.PlaneGeometry(1.5, 2),
                new THREE.MeshStandardMaterial({ color: colors[i % 6] })
            );
            paintL.position.set(-CORRIDOR_WIDTH / 2 + 0.1, 2, z);
            scene.add(paintL);

            const paintR = new THREE.Mesh(
                new THREE.PlaneGeometry(1.5, 2),
                new THREE.MeshStandardMaterial({ color: colors[(i + 1) % 6] })
            );
            paintR.position.set(CORRIDOR_WIDTH / 2 - 0.1, 2, z);
            scene.add(paintR);
        }

        // Door
        const door = new THREE.Mesh(
            new THREE.BoxGeometry(2, 2.5, 0.1),
            new THREE.MeshStandardMaterial({ color: 0x8b4513 })
        );
        door.position.set(0, 1.25, CORRIDOR_LENGTH / 2 - 0.5);
        scene.add(door);

        // Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const light = new THREE.DirectionalLight(0xffffff, 0.8);
        light.position.set(0, 10, 5);
        scene.add(light);

        // Controls
        const keys = {};
        let doorUnlocked = false;

        // Keyboard
        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        // Mobile Joystick
        const joystickContainer = document.getElementById('joystickContainer');
        const joystickThumb = document.getElementById('joystickThumb');
        let joystickActive = false;
        let joystickX = 0, joystickY = 0;

        joystickContainer.addEventListener('touchstart', (e) => {
            joystickActive = true;
        }, { passive: false });

        joystickContainer.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!joystickActive) return;
            
            const touch = e.touches[0];
            const rect = joystickContainer.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            joystickX = (touch.clientX - centerX) / (rect.width / 2);
            joystickY = (touch.clientY - centerY) / (rect.height / 2);
            
            const distance = Math.sqrt(joystickX ** 2 + joystickY ** 2);
            if (distance > 1) {
                joystickX /= distance;
                joystickY /= distance;
            }
            
            const radius = 30;
            joystickThumb.style.transform = `translate(calc(-50% + ${joystickX * radius}px), calc(-50% + ${joystickY * radius}px))`;
        }, { passive: false });

        joystickContainer.addEventListener('touchend', () => {
            joystickActive = false;
            joystickX = 0;
            joystickY = 0;
            joystickThumb.style.transform = 'translate(-50%, -50%)';
        });

        // Jump Button
        document.getElementById('jumpBtn').addEventListener('touchstart', () => {
            if (player.isGrounded) {
                player.velocity.y = 0.15;
                player.isGrounded = false;
            }
        });

        // Password
        window.checkPassword = function() {
            if (document.getElementById('passwordInput').value === '13102024') {
                doorUnlocked = true;
                document.getElementById('passwordPrompt').classList.remove('show');
                showSuccess();
            } else {
                document.getElementById('passwordInput').value = '';
            }
        };

        function showSuccess() {
            const msg = document.getElementById('successMessage');
            msg.classList.add('show');
            
            // Confetti
            for (let i = 0; i < 30; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * window.innerWidth + 'px';
                confetti.style.top = '-10px';
                confetti.style.background = ['#ffd700', '#ff6b6b', '#4ecdc4'][Math.floor(Math.random() * 3)];
                document.body.appendChild(confetti);
                
                let y = 0;
                const fall = setInterval(() => {
                    y += Math.random() * 3 + 1;
                    confetti.style.top = y + 'px';
                    if (y > window.innerHeight) {
                        clearInterval(fall);
                        confetti.remove();
                    }
                }, 20);
            }
        }

        // Animation
        function animate() {
            requestAnimationFrame(animate);

            // Movement
            let moveX = 0, moveZ = 0;

            if (keys['w']) moveZ -= 1;
            if (keys['s']) moveZ += 1;
            if (keys['a']) moveX -= 1;
            if (keys['d']) moveX += 1;

            // Mobile joystick movement
            moveX += joystickX;
            moveZ -= joystickY;

            if (moveX || moveZ) {
                const length = Math.sqrt(moveX ** 2 + moveZ ** 2);
                moveX /= length;
                moveZ /= length;
            }

            player.velocity.x = moveX * player.speed;
            player.velocity.z = moveZ * player.speed;
            player.velocity.y -= 0.01;

            player.position.add(player.velocity);

            // Boundaries
            if (player.position.z > CORRIDOR_LENGTH / 2 - 1) {
                if (!doorUnlocked) {
                    player.position.z = CORRIDOR_LENGTH / 2 - 1;
                    document.getElementById('passwordPrompt').classList.add('show');
                    document.getElementById('passwordInput').focus();
                }
            }

            if (player.position.z < -CORRIDOR_LENGTH / 2 + 0.5) {
                player.position.z = -CORRIDOR_LENGTH / 2 + 0.5;
            }

            const maxX = CORRIDOR_WIDTH / 2 - 0.3;
            if (Math.abs(player.position.x) > maxX) {
                player.position.x = Math.sign(player.position.x) * maxX;
            }

            if (player.position.y <= 1.6) {
                player.position.y = 1.6;
                player.velocity.y = 0;
                player.isGrounded = true;
            } else {
                player.isGrounded = false;
            }

            if (keys[' '] && player.isGrounded) {
                player.velocity.y = 0.15;
                player.isGrounded = false;
            }

            camera.position.copy(player.position);
            renderer.render(scene, camera);
        }

        // Handle resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();

        // Enter key
        document.getElementById('passwordInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkPassword();
        });

        // Prevent default mobile behaviors
        document.addEventListener('touchmove', (e) => {
            if (e.target === canvas) e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
